[project]
name = "filemaster-ai-bot"
version = "0.1.0"
description = "Professional Telegram file processing SaaS bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic-settings>=2.4.0",
  "celery>=5.4.0",
  "redis>=5.0.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "PyPDF2>=3.0.1",
  "Pillow>=10.4.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
