version: '3.9'
services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    depends_on:
      - redis
      - db
  worker:
    build: .
    command: celery -A worker.celery_app worker -l info -Q convert,compress
    env_file: .env
    depends_on:
      - redis
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: filemaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
